name: run-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.6', '8.5', '8.4']
        laravel: ['13.*', '12.*']
        stability: [prefer-stable]
        exclude:
          - php: '8.6'
            laravel: 12.*
        include:
          - laravel: 13.*
            testbench: ^11.0
            pest: ^5.3.5
          - laravel: 12.*
            testbench: ^10.8
            pest: ^4.7.8

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SQLite 3
        run: |
          sudo apt-get update
          sudo apt-get install sqlite3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
          coverage: none
        env:
          fail-fast: true

      - name: Verify PHP version
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
        run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION === getenv("EXPECTED_PHP_VERSION") ? 0 : 1);'

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer remove "larastan/larastan" "laravel/slack-notification-channel" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
